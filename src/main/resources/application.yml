spring:
  application:
    name: spring-memory-mcp
    version: @project.version@
  main.banner-mode: off
  config:
    import:
      - file:./config.yml
  ai:
    mcp:
      server:
        name: spring-memory-mcp
        version: @project.version@
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        instructions: |
          Persistent memory: the `memory` tool gives full, unrestricted access to your own dedicated
          PostgreSQL 18 database, selected automatically by your access token. Every statement is plain
          SQL - DDL, DML and SELECT alike. You may create any tables, views, materialized views, functions,
          procedures, triggers, sequences and indexes; enable extensions (CREATE EXTENSION, e.g. pg_trgm,
          pgcrypto, pgvector); and store any data in any form (JSONB, arrays, ranges, tsvector, vectors).
          Data persists between sessions and conversations - nothing is reset unless you drop it.
          Recommended: first inspect what you already have
          (SELECT table_name FROM information_schema.tables WHERE table_schema = 'public'),
          keep a metadata table describing what each table is for, prefer JSONB for loosely
          structured notes, use UPSERT (INSERT ... ON CONFLICT) to update knowledge in place,
          and clean up outdated data deliberately - the database is long-lived first-class state.
          Mandatory convention: every object you create - tables, columns, indexes, views, procedures -
          must get a COMMENT (COMMENT ON TABLE / COLUMN / INDEX / VIEW / FUNCTION) explaining its purpose,
          so any future session can understand the schema without guessing.
          Sharing results with the user: call the get_connection_info tool - it returns the public read-only
          endpoint and the SHA-256 token to use with it. Then POST {"query": "<SQL SELECT>"} to that endpoint
          with header X-Access-Token set to the returned token; it returns JSON rows. Never expose your raw
          access token - only the hash from get_connection_info. You may embed this endpoint into HTML pages
          or dashboards you build for the user. If the database rejects the query, the endpoint answers
          HTTP 400 with {"error": "..."} - that is the answer to your request, not a broken transport,
          so read the message and fix the query instead of retrying it.
        capabilities:
          tool: true
          prompt: false
          completion: false
          resource: false

memory:
  public-url: ${PUBLIC_URL:http://localhost:8080}
